<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart | Kalasetu</title>

    <link rel="stylesheet" href="cart.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="top-header">

        <div class="brand">

            <div class="logo-wrap">
                <img
                    src="images/kalasetu-logo.png"
                    alt="Kalasetu Logo"
                >
            </div>

            <div class="brand-text">
                <h1>Kalasetu</h1>
                <p>TRADITION • CRAFT • STORY</p>
            </div>

        </div>

        <a
            href="customer-home.html"
            class="back-btn"
        >
            ← Continue Shopping
        </a>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="main-area">

        <section class="cart-container">

            <h2>My Cart</h2>

            <p class="description">
                Review your selected handmade crafts before checkout.
            </p>


            <!-- CART ITEMS -->

            <div id="cartList">

                <!-- Javascript will display cart items here -->

            </div>


            <!-- CART SUMMARY -->

            <div
                class="cart-summary"
                id="cartSummary"
            >

                <div class="summary-row">
                    <span>Subtotal</span>
                    <strong id="subtotal">
                        ₹0
                    </strong>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <strong>
                        Free
                    </strong>
                </div>

                <div class="summary-line"></div>

                <div class="summary-total">
                    <span>Total</span>
                    <strong id="total">
                        ₹0
                    </strong>
                </div>

                <button
                    type="button"
                    class="checkout-btn"
                    onclick="proceedToCheckout()"
                >
                    Proceed to Checkout →
                </button>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        © 2026 Kalasetu • Tradition • Craft • Story

    </footer>


    <script src="cart.js"></script>

</body>

</html>
