<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalasetu - Creator Login</title>

    <link rel="stylesheet" href="creator-auth.css">
</head>

<body>

    <div class="auth-page">

        <div class="overlay"></div>

        <div class="auth-container">

            <!-- LOGO -->
            <div class="logo-circle">
                <img
                    src="images/kalasetu-logo.png"
                    alt="Kalasetu"
                >
            </div>

            <h1>KALASETU</h1>

            <div class="tagline">
                <span></span>
                <p>TRADITION • CRAFT • STORY</p>
                <span></span>
            </div>


            <!-- LOGIN CARD -->
            <div class="auth-card">

                <p class="welcome">
                    WELCOME BACK
                </p>

                <h2>Creator Login</h2>

                <p class="sub-text">
                    Share your craft and stories with the world.
                </p>


                <form id="creatorForm">

                    <div class="input-group">

                        <label for="email">
                            Email or Phone
                        </label>

                        <input
                            type="text"
                            id="email"
                            placeholder="Enter your email or phone"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div class="options">

                        <label class="remember">

                            <input type="checkbox">

                            Remember me

                        </label>

                        <a href="#" id="forgotPassword">
                            Forgot Password?
                        </a>

                    </div>


                    <button type="submit">

                        LOGIN

                        <span>→</span>

                    </button>

                </form>


                <div class="divider">

                    <span></span>

                    OR

                    <span></span>

                </div>


                <p class="register-text">

                    New to Kalasetu?

                    <a
                        href="creator-register.html"
                        id="registerLink"
                    >
                        Create an account
                    </a>

                </p>

            </div>


            <p class="bottom-text">
                HANDMADE WITH TRADITION • CONNECTED THROUGH STORIES
            </p>

        </div>

    </div>


    <script src="creator-auth.js"></script>

</body>

</html>
