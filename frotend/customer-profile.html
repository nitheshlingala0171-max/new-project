<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalasetu - Customer Profile</title>

    <link rel="stylesheet" href="customer-profile.css">
</head>

<body>

    <!-- ================= PROFILE PAGE ================= -->

    <main class="profile-page">

        <div class="profile-overlay"></div>

        <section class="profile-container">

            <!-- LOGO -->
            <div class="profile-logo">
                <img
                    src="images/kalasetu-logo.png"
                    alt="Kalasetu Logo"
                >
            </div>

            <!-- BRAND -->
            <div class="brand-name">
                KALASETU
            </div>

            <div class="brand-tagline">
                TRADITION • CRAFT • STORY
            </div>


            <!-- PROFILE BOX -->

            <div class="profile-card">

                <div class="profile-heading">

                    <div class="profile-icon">

                        <svg viewBox="0 0 24 24">

                            <circle
                                cx="12"
                                cy="8"
                                r="4"
                            ></circle>

                            <path
                                d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"
                            ></path>

                        </svg>

                    </div>

                    <div>
                        <h1>Customer Profile</h1>

                        <p>
                            Manage your Kalasetu account
                        </p>
                    </div>

                </div>


                <!-- CUSTOMER DETAILS -->

                <div class="customer-details">

                    <div class="detail-item">

                        <span class="detail-label">
                            Name
                        </span>

                        <span class="detail-value" id="profileName">
    Customer
</span>

                    </div>


                    <div class="detail-item">

                        <span class="detail-label">
                            Phone Number
                        </span>

                       <span class="detail-value" id="profileContact">
    +91 XXXXX XXXXX
</span>

                    </div>

                </div>


                <!-- ACCOUNT OPTIONS -->

                <div class="profile-options">


                    <!-- MY ORDERS -->

                    <a
                        href="my-orders.html"
                        class="profile-option"
                    >

                        <div class="option-left">

                            <span class="option-icon">

                                <svg viewBox="0 0 24 24">

                                    <path
                                        d="M6 3h12v18H6z"
                                    ></path>

                                    <path
                                        d="M9 7h6"
                                    ></path>

                                    <path
                                        d="M9 11h6"
                                    ></path>

                                    <path
                                        d="M9 15h4"
                                    ></path>

                                </svg>

                            </span>

                            <span>
                                My Orders
                            </span>

                        </div>

                        <span class="arrow">
                            ›
                        </span>

                    </a>


                    <!-- WISHLIST -->

                    <a
                        href="wishlist.html"
                        class="profile-option"
                    >

                        <div class="option-left">

                            <span class="option-icon">

                                <svg viewBox="0 0 24 24">

                                    <path
                                        d="M20.8 8.6c0 5.5-8.8 10.4-8.8 10.4S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.8 2.2z"
                                    ></path>

                                </svg>

                            </span>

                            <span>
                                Wishlist
                            </span>

                        </div>

                        <span class="arrow">
                            ›
                        </span>

                    </a>


                    <!-- CUSTOM CRAFT REQUEST -->

                    <a
                        href="custom-craft-requests.html"
                        class="profile-option custom-request"
                    >

                        <div class="option-left">

                            <span class="option-icon">

                                <svg viewBox="0 0 24 24">

                                    <path
                                        d="M12 3l2.4 5.1L20 9l-4 3.9.9 5.6-4.9-2.7-4.9 2.7.9-5.6L4 9l5.6-.9L12 3z"
                                    ></path>

                                </svg>

                            </span>

                            <span>
                                My Custom Craft Requests
                            </span>

                        </div>

                        <span class="arrow">
                            ›
                        </span>

                    </a>


                    <!-- SAVED ADDRESS -->

                    <a
                        href="saved-address.html"
                        class="profile-option"
                    >

                        <div class="option-left">

                            <span class="option-icon">

                                <svg viewBox="0 0 24 24">

                                    <path
                                        d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"
                                    ></path>

                                    <circle
                                        cx="12"
                                        cy="10"
                                        r="2.5"
                                    ></circle>

                                </svg>

                            </span>

                            <span>
                                Saved Address
                            </span>

                        </div>

                        <span class="arrow">
                            ›
                        </span>

                    </a>


                    <!-- ACCOUNT SETTINGS -->

                    <a
                        href="account-settings.html"
                        class="profile-option"
                    >

                        <div class="option-left">

                            <span class="option-icon">

                                <svg viewBox="0 0 24 24">

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    ></circle>

                                    <path
                                        d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.7v-2.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1z"
                                    ></path>

                                </svg>

                            </span>

                            <span>
                                Account Settings
                            </span>

                        </div>

                        <span class="arrow">
                            ›
                        </span>

                    </a>

                </div>


                <!-- BACK BUTTON -->

                <a
                    href="customer-home.html"
                    class="back-button"
                >
                    ← Back to Home
                </a>


                <!-- LOGOUT -->

                <button
                    class="logout-button"
                    type="button"
                >
                    Logout
                </button>

            </div>

        </section>

    </main>
<script src="customer-profile.js"></script>
</body>

</html>
