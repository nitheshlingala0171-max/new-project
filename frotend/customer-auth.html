<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer - Kalasetu</title>

    <link rel="stylesheet" href="customer-auth.css">
</head>

<body>

    <div class="auth-page">

        <div class="overlay"></div>

        <div class="auth-container">

            <!-- Logo -->
            <div class="logo-circle">
                <img src="images/kalasetu-logo.png" alt="Kalasetu">
            </div>

            <h1>KALASETU</h1>

            <div class="tagline">
                <span></span>
                <p>TRADITION • CRAFT • STORY</p>
                <span></span>
            </div>


            <!-- Authentication Card -->
            <div class="auth-card">

                <p class="welcome">WELCOME BACK</p>

                <h2>Customer Login</h2>

                <p class="sub-text">
                    Discover beautiful handmade crafts and stories.
                </p>


                <form id="customerForm">

                    <div class="input-group">
                        <label for="email">Email or Phone</label>

                        <input
                            type="text"
                            id="email"
                            placeholder="Enter your email or phone"
                            required
                        >
                    </div>


                    <div class="input-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <div class="options">

                        <label class="remember">
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#" id="forgotPassword">
                            Forgot Password?
                        </a>

                    </div>


                    <button type="submit">
                        LOGIN
                        <span>→</span>
                    </button>

                </form>


                <div class="divider">
                    <span></span>
                    OR
                    <span></span>
                </div>


                <p class="register-text">
                    New to Kalasetu?
                   <a href="customer-register.html" id="registerLink">
    Create an account
</a>
                </p>

            </div>


            <p class="bottom-text">
                HANDMADE WITH TRADITION • CONNECTED THROUGH STORIES
            </p>

        </div>

    </div>


    <script src="customer-auth.js"></script>

</body>
</html>
