<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KALASETU | Tradition • Craft • Story</title>

    <link rel="stylesheet" href="css/splash.css">
</head>

<body>

    <main class="splash-screen">

        <!-- LEFT CONTENT -->
        <section class="splash-content">

            <!-- KALASETU LOGO -->
            <img
                src="assets/images/kalasetu-logo.jpeg"
                alt="KALASETU Logo"
                class="kalasetu-logo"
            >

            <h1>KALASETU</h1>

            <div class="brand-line">
                <span></span>

                <p>TRADITION • CRAFT • STORY</p>

                <span></span>
            </div>


            <!-- MAIN MESSAGE -->

            <h2>
                Connecting Crafts,<br>
                Stories &amp; People
            </h2>


            <!-- DESCRIPTION -->

            <p class="description">
                Discover authentic handmade crafts<br>
                and the stories of the artisans behind them.
            </p>


            <!-- GET STARTED -->

            <button
                class="get-started"
                onclick="window.location.href='role.html'">

                GET STARTED

                <span>→</span>

            </button>

        </section>


        <!-- RIGHT CRAFT IMAGE -->

        <section class="craft-visual">

            <div class="craft-image-wrapper">

                <img
                    src="assets/images/craft-hero.jpeg"
                    alt="Handmade Indian Craft"
                    class="craft-image"
                >

            </div>

        </section>


        <!-- DECORATIVE BOTTOM WAVE -->

        <div class="bottom-wave"></div>

    </main>


    <script>

        function startKalasetu() {

            window.location.href = "pages/role.html";

        }

    </script>
